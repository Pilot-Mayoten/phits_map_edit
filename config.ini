[PHITS]
# PHITSの実行コマンド
command = phits.bat

# デフォルトのシミュレーションパラメータ
default_maxcas = 10000
default_maxbch = 10

[Environment]
# デフォルトの核種
default_nuclide = Cs-137

# デフォルトの放射能 (Bq)
default_activity = 1.0E+12

[Visualization]
# 日本語フォントディレクトリ
font_directory = C:/Windows/Fonts

# 優先フォントファイル（先に見つかったものを使用）
font_files = meiryo.ttc,msgothic.ttc,yugothb.ttc

[Logging]
# ログファイルの出力先
log_directory = logs

# ログファイルの接頭辞
log_prefix = phits_map_edit

[UI]
# ウィンドウサイズ
window_width = 1200
window_height = 820

# グリッドの幅
grid_width = 720

# 制御パネルの幅
control_panel_width = 300

[Application]
# アプリケーションタイトル
title = 🗺️ PHITS Map Editor & Route Planner

# アプリケーションバージョン
version = 1.0.0
